<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가사 플레이어</title>
<style>
:root{--fg:#fff;--dim:#8a8a8a;--line:#3a3a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#000;color:var(--fg);font-family:"Segoe UI","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
[hidden]{display:none!important}
body.idle{cursor:none}
#list{width:min(520px,92vw);max-height:34vh;overflow:auto;border-top:1px solid var(--line);text-align:left}
.tr{padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer;display:flex;gap:10px;justify-content:space-between}
.tr:hover{background:#1a1a1a}.tr.on{background:#fff;color:#000}.tr small{color:var(--dim);white-space:nowrap}.tr.on small{color:#444}
button.on{background:#fff;color:#000}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fxm{position:fixed;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#000;border:1px solid #fff;padding:12px 16px;display:flex;flex-direction:column;gap:9px;z-index:6;font-size:14px}
#fxm label{display:flex;gap:8px;align-items:center;cursor:pointer}
#fxm{max-height:70vh;overflow:auto}
#fxm input{accent-color:#fff}
body.idle #fxm{opacity:0;pointer-events:none}
#bar{flex-wrap:wrap}
.ver{opacity:.45;font-size:12px;white-space:nowrap;letter-spacing:.03em}
#panel{overflow:hidden}
#pat{position:absolute;inset:-30%;overflow:hidden;opacity:.3;pointer-events:none;transform:rotate(-20deg);display:flex;flex-direction:column;justify-content:center;gap:1.2vmin;z-index:0}
#panel>*:not(#pat){position:relative;z-index:1}
.prow{white-space:nowrap;font-size:9vmin;font-weight:700;line-height:1.1;animation:pm 70s linear infinite alternate}
.prow:nth-child(even){animation-direction:alternate-reverse}
#pat2{transition:transform 2.8s ease-in-out;position:fixed;inset:-30%;overflow:hidden;opacity:.2;pointer-events:none;transform:rotate(-20deg);display:flex;flex-direction:column;justify-content:center;gap:1.2vmin}
.prow span{display:inline-block;margin-right:.6em}
.prow span:not([data-bx]):not([data-fo]){color:#fff!important}
.c.cut{color:transparent;position:relative}
.c.cut::before,.c.cut::after{content:attr(data-t);position:absolute;left:0;top:0;white-space:pre;color:var(--cc,#fff)}
.c.cut::before{clip-path:inset(0 0 calc(100% - var(--cy,50%)) 0);transform:translateX(calc(var(--dx,.06em)*-1))}
.c.cut::after{clip-path:inset(var(--cy,50%) 0 0 0);transform:translateX(var(--dx,.06em))}
.line.scr::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--scr)}
.c.stn{position:relative}
.c.stn::after{content:"";position:absolute;left:-.02em;right:-.02em;top:calc(var(--gc,53%) - var(--g,.03em));height:calc(var(--g,.03em)*2);background:#000}
@keyframes pm{from{transform:translateX(0)}to{transform:translateX(-30%)}}
@media (prefers-reduced-motion:reduce){.prow{animation:none}}
body.tv .prow{animation:none!important}
body.tv #pat,body.tv #pat2{display:none!important}
#ttl{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 26px;text-align:center;font-size:16px;color:#fff;background:linear-gradient(#000c,transparent);z-index:4;transition:opacity .4s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.idle #ttl{opacity:0}
#stage{position:fixed;inset:0;perspective:900px;overflow:hidden}
#trackIntro{position:fixed;inset:0;z-index:8;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;padding:5vh 7vw;text-align:center}
#introCover{width:min(34vh,42vw);height:min(34vh,42vw);object-fit:contain;background:#111;display:block}
#introFallback{width:min(34vh,42vw);height:min(34vh,42vw);display:flex;align-items:center;justify-content:center;border:2px solid #555;color:#aaa;font-size:min(18vh,22vw)}
#introTitleRow{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,28px);max-width:90vw}
#introTitle{font-size:clamp(30px,5.4vw,58px);font-weight:800;line-height:1.2;max-width:64vw;overflow-wrap:anywhere;color:#fff}
.introRule{height:5px;width:var(--intro-rule,36px);background:#eee;flex:0 0 auto}
#introArtist{font-size:clamp(22px,3.2vw,36px);font-weight:500;color:#ddd;line-height:1.35;max-width:86vw;overflow-wrap:anywhere}
body.tv #trackIntro{gap:3.5vh}
body.tv #introTitle{font-size:clamp(44px,6vw,72px)}
body.tv #introArtist{font-size:clamp(30px,3.5vw,42px)}
.line{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;max-width:90vw;text-align:center;font-weight:700;line-height:1.15;letter-spacing:-.01em;color:#fff}
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;white-space:pre}
#panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px;z-index:5}

#panel.drag{outline:2px dashed #fff;outline-offset:-16px}

button:hover,.btn:hover{background:#fff;color:#000}
button:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:3px}

#status{min-height:1.6em;color:#fff;font-size:15px}

body.idle #bar{opacity:0;pointer-events:none}
#bar button{padding:7px 14px;font-size:14px}
#seek{flex:1;accent-color:#fff;min-width:60px}

@media (max-width:640px){#off,#time{display:none}}
#tap{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;background:rgba(0,0,0,.88);color:#fff;cursor:pointer;text-align:center;padding:4vmin}
#tap[hidden]{display:none}
#tap .tb{font-size:7vmin;font-weight:700}
#tap .ts{font-size:2.4vmin;color:#aaa;line-height:1.5}
#quit{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:20px;z-index:7;font-size:30px;font-weight:700;padding:14px 30px;border:3px solid #fff;background:#000;letter-spacing:.05em;transition:opacity .4s}
#quit:hover,#quit:focus-visible{background:#fff;color:#000}
#quit[hidden]{display:none}
body.idle #quit{opacity:0;pointer-events:none}

#bye[hidden]{display:none}
#bye .tb{font-size:7vmin;font-weight:700}

/* ===== Android TV (10-foot UI) ===== */

</style>

<script>
/* 무한반복 애니메이션 안전망: 요소가 DOM에서 빠졌는데 무한 애니메이션이 남는 경우를 찾아 취소한다.
   (document.getAnimations()는 DOM에서 빠진 요소의 애니메이션을 돌려주지 않아서 기존 정리 코드가 못 잡던 부분) */
window.TV=!!(window.Android&&window.Android.isTv)||/[?&]tv=1/.test(location.search);
window.LITE=!!window.TV&&(function(){try{return localStorage.getItem('tvlite')!=='0'}catch(e){return true}})();
(function(){
  window.__swept=0;
  if(window.TV){window.__sweepAnims=function(){return 0};window.__liveInf=function(){return 0};return}
  var live=new Set(),orig=Element.prototype.animate;
  Element.prototype.animate=function(kf,opt){
    if(window.LITE&&Array.isArray(kf)){kf=kf.map(function(k){if(k&&k.filter!==undefined){k=Object.assign({},k);delete k.filter}return k})}
    var a=orig.call(this,kf,opt);
    try{if(opt&&opt.iterations===Infinity){live.add(a);a.addEventListener('cancel',function(){live.delete(a)})}}catch(e){}
    return a;
  };
  window.__sweepAnims=function(){
    var n=0;
    live.forEach(function(a){
      try{var t=a.effect&&a.effect.target;if(!t||!t.isConnected){a.cancel();live.delete(a);n++}}
      catch(e){live.delete(a)}
    });
    window.__swept+=n;return n;
  };
  window.__liveInf=function(){return live.size};
  setInterval(function(){window.__sweepAnims()},30000);
})();
</script>

<script>
const VER='v1.19-PC / TV 가사 연출 곡별 랜덤 · 2026-11-02';document.querySelectorAll('.ver').forEach(e=>e.textContent=VER);
const $=id=>document.getElementById(id);
const au=$('au'),stage=$('stage'),panel=$('panel'),bar=$('bar'),statusEl=$('status'),goBtn=$('go');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lines=[],tagOff=0,userOff=0,audioReady=false,cur=null,curIdx=-2,lastEff=-1;

/* ---------- 파일 불러오기 ---------- */
const AUDIO_EXT=/\.(mp3|flac|m4a|wav|ogg|opus|aac|wma|aiff?)$/i;
async function readText(file){
  const buf=await file.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}
  catch(e){try{return new TextDecoder('euc-kr').decode(buf)}catch(e2){return new TextDecoder('utf-8').decode(buf)}}
}
function parseLRC(txt){
  const out=[];let off=0;
  for(const raw of txt.split(/\r?\n/)){
    const o=raw.match(/^\s*\[offset:\s*(-?\d+)\s*\]/i);
    if(o){off=+o[1]/1000;continue}
    const re=/\[(\d+):(\d+(?:[.:]\d+)?)\]/g,ts=[];let m,last=0;
    while((m=re.exec(raw))){ts.push(+m[1]*60+parseFloat(m[2].replace(':','.')));last=re.lastIndex}
    if(!ts.length)continue;
    const rest=raw.slice(last),text=rest.replace(/<\d+:\d+(?:[.:]\d+)?>/g,'').trim();
    const ew=[...rest.matchAll(/<(\d+):(\d+(?:[.:]\d+)?)>([^<]*)/g)].map(m=>({t:+m[1]*60+parseFloat(m[2].replace(':','.')),w:m[3]}));
    ts.forEach(t=>out.push({t,text,ew:ew.length?ew:null}));
  }
  out.sort((a,b)=>a.t-b.t);
  return {lines:out,off};
}
async function handleFilesOld(list){
  let name='',lrcName='';
  for(const f of list){
    if(/\.(lrc|txt)$/i.test(f.name)){
      const r=parseLRC(await readText(f));
      lines=r.lines;tagOff=r.off;lrcName=f.name;
    }else if(f.type.startsWith('audio/')||AUDIO_EXT.test(f.name)){
      if(au.src)URL.revokeObjectURL(au.src);
      au.src=URL.createObjectURL(f);audioReady=true;name=f.name;
    }
  }
  const parts=[];
  if(audioReady)parts.push('음악 준비됨'+(name?': '+name:''));
  if(lines.length)parts.push('가사 '+lines.length+'줄'+(lrcName?': '+lrcName:''));
  statusEl.textContent=parts.join(' / ')||'음악 또는 LRC 파일을 찾지 못했습니다.';
  if(!audioReady||!lines.length)statusEl.textContent+=(audioReady?' — LRC 파일이 더 필요합니다.':'')+(!audioReady&&lines.length?' — 음악 파일이 더 필요합니다.':'');
  goBtn.disabled=!(audioReady&&lines.length);
  curIdx=-2;
}
$('files').onchange=e=>handleFiles([...e.target.files]);

function bpt(s,u){

<script>
(function(){

      if(!playing)return;
      if(cmd==='left')nextTrack(-1);
      else if(cmd==='right')nextTrack(1);
      else if(cmd==='up'||cmd==='down')enterNav();
      else if(cmd==='ok'){toggle();toast(au.paused?'❚❚ 일시정지':'▶ 재생')}
      return;
    }
    if(navMode)armNav();
    if(cmd==='ok')ok();else dirKey(cmd);
    poke();
  }catch(e){console.error(e)}
  finally{setTimeout(ensure,20)}
}
/* 재생 화면에서 좌우 한 번은 기존 동작, 350ms 안에 같은 방향 두 번은 곡 이동 */
var lrTap={left:null,right:null};
window.tvKey=function(cmd,rep){
  if((cmd==='left'||cmd==='right') && rep===0 && scopeRoot()===null && !$('bar').hidden){
    var dir=cmd, pending=lrTap[dir];
    if(pending){clearTimeout(pending.timer);lrTap[dir]=null;
      if(dir==='left')tvKeyImmediate('prev',0);else tvKeyImmediate('next',0);
      return;
    }
    var item={timer:setTimeout(function(){lrTap[dir]=null;tvKeyImmediate(dir,0)},350)};
    lrTap[dir]=item;
    return;
  }
  tvKeyImmediate(cmd,rep);
};
/* 안드로이드 앱 밖(PC 브라우저 ?tv=1)에서 키보드로 시험할 때 */
if(!A){
  var KM={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back',ContextMenu:'menu'};
  addEventListener('keydown',function(e){var c=KM[e.key];if(!c)return;e.preventDefault();e.stopImmediatePropagation();window.tvKey(c,e.repeat?1:0)},true);
}

/* ---------- 재생 불가 곡은 건너뛴다 (연속 5회까지) ---------- */
var errN=0,oe=au.onerror;
au.onerror=function(){
  if(oe)oe.apply(this,arguments);
  if(bar.hidden||++errN>5)return;
  setTimeout(function(){if(au.error){panel.hidden=true;nextTrack(1)}},1200);
};
au.addEventListener('playing',function(){errN=0});

/* ---------- USB 불러오기 (안드로이드 앱이 읽어 로컬 서버로 제공) ---------- */
var MIME={mp3:'audio/mpeg',flac:'audio/flac',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',opus:'audio/ogg'};
function vfile(e){
  var url=location.pathname.replace(/[^\/]*$/,'')+'f/'+e.i;
  var ext=(e.n.split('.').pop()||'').toLowerCase();
  var f={name:e.n,dir:e.d,size:e.s,type:e.a?(MIME[ext]||'audio/mpeg'):'text/plain',url:url};
  var get=function(h){return fetch(url,h?{headers:h}:undefined).then(function(r){return r.ok?r.arrayBuffer():new ArrayBuffer(0)})};
  f.arrayBuffer=function(){return get()};
  f.slice=function(a,b){
    var end=Math.min(b,f.size);
    return {arrayBuffer:function(){return a>=end?Promise.resolve(new ArrayBuffer(0)):get({Range:'bytes='+a+'-'+(end-1)})}};
  };
  return f;
}
var scanning=false;
// 앱 실행 후 USB 검색이 성공하면 자동 랜덤 재생한다.
var autoLaunchScanPending=false;
$('usbBtn').onclick=function(){
  if(scanning)return;
  if(!A||!A.scanUsb){$('status').textContent='안드로이드 앱에서만 사용할 수 있습니다.';return}
  scanning=true;$('status').textContent='USB 검색 중…';A.scanUsb();
};
window.onUsbProgress=function(n){$('status').textContent='USB 검색 중… 파일 '+n+'개 발견'};
window.onUsbDone=function(n,via,note){
  scanning=false;
  var st=$('status');
  if(!n){st.textContent=note||'음악 파일을 찾지 못했습니다.';return}
  var out=[],i=0;
  (function page(){
    var j=JSON.parse(A.getEntries(i,400));
    j.forEach(function(e){out.push(vfile(e))});
    i+=j.length;
    if(j.length===400){setTimeout(page,0);return}
    handleFiles(out).then(function(){
      st.textContent=st.textContent+' · '+via;
      if(autoLaunchScanPending&&tracks.length){
        autoLaunchScanPending=false;
        setShuffle(true);
        startIdx=null;
        goBtn.onclick(); // 매 실행마다 새 랜덤 순서를 만들고 첫 곡 자동 재생
      }else{
        var g=$('go');if(!panel.hidden&&!g.disabled)focusEl(g);
      }
    });
  })();
};
window.onUsbAttached=function(){
  if(!panel.hidden&&!tracks.length)$('usbBtn').click();
  else toast('USB가 연결되었습니다. 목록 화면에서 "USB에서 음악 불러오기"를 누르세요');
};

setTimeout(ensure,300);
if(A&&A.ready&&A.ready()){autoLaunchScanPending=true;$('usbBtn').click();}
})();
</script>

<script>
(function(){
'use strict';
if(!window.TV)return;
/* 가사 연출 (v1.9): 한 곡에는 효과 1개만 쓰고, 곡이 바뀔 때마다 켜져 있는 효과 중 하나를 랜덤으로 고른다.
   모든 효과는 '줄 전체에 걸리는 애니메이션 1개'이며 길이 0.45초 이하, 이동 거리는 작게, 반복·튕김 없음.
   글자별 애니메이션, 블러, 캔버스, 오디오 분석(WebAudio)은 사용하지 않는다.
   배경색은 메뉴와 상관없이 항상 적용(곡마다 정지 그라데이션). */
var KEY='lfx2';
var EFFECTS=[
  ['rise','아래에서 살짝 떠오름',''],
  ['drop','위에서 살짝 내려옴',''],
  ['slide','옆에서 짧게 밀려옴','방향은 곡마다 고정'],
  ['pop','살짝 커지며 나타남',''],
  ['line','밑줄이 가운데서 늘어남',''],
  ['cross','이전 줄이 서서히 사라지며 겹침','나타나는 효과 없음']
];
var NAME={};EFFECTS.forEach(function(e){NAME[e[0]]=e[1]});
var LFX=window.LFX={};
EFFECTS.forEach(function(e){LFX[e[0]]=1});                       // 기본: 전부 켜짐(그중 곡마다 하나 랜덤)
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv)EFFECTS.forEach(function(e){if(e[0] in sv)LFX[e[0]]=sv[e[0]]?1:0})}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(LFX))}catch(e){}}

/* ---------- 곡마다 효과 1개 고르기 ---------- */
var songFx=null,songDir=1,lastFx=null;
function pickFx(){
  var on=EFFECTS.map(function(e){return e[0]}).filter(function(k){return LFX[k]});
  if(!on.length)return null;
  var pool=on.length>1?on.filter(function(k){return k!==lastFx}):on;   // 바로 앞 곡과 같은 효과는 피한다
  return pool[Math.floor(Math.random()*pool.length)];
}
function newSong(){songFx=pickFx();lastFx=songFx;songDir=Math.random()<.5?-1:1;updateNow()}
function updateNow(){var n=document.getElementById('lfxnow');if(n)n.textContent='이 곡: '+(songFx?NAME[songFx]:'효과 없음')}

/* ---------- 줄이 나타날 때 ---------- */
function D(el,kf,ms,ease){try{el.animate(kf,{duration:ms,easing:ease||'ease-out',fill:'backwards'})}catch(e){}}
window.lfxApply=function(el,c,i,L,nx,words){
  switch(songFx){
    case 'rise':D(el,[{opacity:0,translate:'0 .22em'},{opacity:1,translate:'0 0'}],400);break;
    case 'drop':D(el,[{opacity:0,translate:'0 -.22em'},{opacity:1,translate:'0 0'}],400);break;
    case 'slide':D(el,[{opacity:0,translate:(songDir*2.5)+'vw 0'},{opacity:1,translate:'0 0'}],380);break;
    case 'pop':D(el,[{opacity:0,scale:.96},{opacity:1,scale:1}],360);break;
    case 'line':
      var u=document.createElement('span');u.className='lfx-ul';el.appendChild(u);
      D(u,[{transform:'scaleX(0)',opacity:.2},{transform:'scaleX(1)',opacity:.75}],450,'cubic-bezier(.2,.8,.2,1)');
      break;
  }
};

/* ---------- 줄이 바뀔 때(이전 줄 정리) ---------- */
window.lfxLeave=function(c){
  var el=c.el;
  if(songFx==='cross'){
    try{el.animate([{opacity:1},{opacity:0}],{duration:240,easing:'ease-in',fill:'forwards'}).onfinish=function(){cleanRemove(el)};return}catch(e){}
  }
  cleanRemove(el);
};

/* ---------- 곡마다 배경(정지 그라데이션 3겹, 항상 적용) ---------- */
function applyBg(name){
  var h=0;for(var j=0;j<name.length;j++)h=(h*31+name.charCodeAt(j))%360;
  var h2=(h+40)%360,st=document.body.style;
  st.backgroundColor='#000';
  st.backgroundImage=[
    'radial-gradient(ellipse at 50% 42%,hsl('+h+',38%,17%) 0%,rgba(0,0,0,0) 62%)',        // 가운데 은은한 빛
    'radial-gradient(ellipse at 88% 100%,hsl('+h2+',34%,13%) 0%,rgba(0,0,0,0) 55%)',      // 모서리의 약한 다른 색
    'linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)'  // 위아래 어둡게
  ].join(',');
}
var _lt=window.loadTrack;
if(typeof _lt==='function'){
  window.loadTrack=function(i){
    var t=tracks[i];
    applyBg(t?(t.title||''):'');
    newSong();
    return _lt.apply(this,arguments);
  };
}

/* ---------- 리모컨 메뉴 ---------- */
var box=document.createElement('div');box.id='lfx';box.hidden=true;
box.innerHTML='<h3>가사 연출 · 곡마다 하나가 랜덤 적용</h3><div class="now" id="lfxnow"></div>'+EFFECTS.map(function(it){
  return '<label><input type="checkbox" data-k="'+it[0]+'"'+(LFX[it[0]]?' checked':'')+'>'+it[1]+(it[2]?'<small>'+it[2]+'</small>':'')+'</label>';
}).join('')+'<button id="lfxall">모두 켜기 (랜덤)</button><button id="lfxoff">모두 끄기</button>';
document.body.appendChild(box);
function setAll(v){
  EFFECTS.forEach(function(e){LFX[e[0]]=v});save();
  [].forEach.call(box.querySelectorAll('input'),function(i){i.checked=!!v});
  songFx=null;lastFx=null;newSong();
}
box.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.dataset||!t.dataset.k)return;
  LFX[t.dataset.k]=t.checked?1:0;save();
  if(!songFx||!LFX[songFx]){songFx=pickFx();lastFx=songFx;updateNow()}   // 지금 곡에 쓰던 효과를 껐으면 다른 걸로 바로 교체
});
$('lfxall').onclick=function(){setAll(1)};
$('lfxoff').onclick=function(){setAll(0)};
applyBg('');newSong();
})();
</script>
</body>
